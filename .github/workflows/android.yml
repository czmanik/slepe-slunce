name: Android APK
on: [push, pull_request]
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu runners include command-line tools, but sdkmanager is not on PATH.
      - run: "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle :app:assembleDebug --no-daemon
        working-directory: android-app
      - uses: actions/upload-artifact@v4
        with:
          name: slepe-slunce-android-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
