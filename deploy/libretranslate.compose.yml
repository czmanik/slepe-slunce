services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      LT_LOAD_ONLY: cs,en
    volumes:
      - libretranslate_models:/home/libretranslate/.local:rw
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  libretranslate_models:
